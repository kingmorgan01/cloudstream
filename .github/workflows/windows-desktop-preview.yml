name: Windows Desktop Preview

on:
  workflow_dispatch:
  push:
    branches: [windows-desktop-preview]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Find WiX
        shell: pwsh
        run: |
          $wixBin = if ($env:WIX) { Join-Path $env:WIX 'bin' } else { '' }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            if ($wixBin -and (Test-Path (Join-Path $wixBin 'candle.exe'))) {
              $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install wixtoolset --version=3.14.1 --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
      - name: Build the installer
        shell: cmd
        run: gradlew.bat :desktopApp:packageExe --configure-on-demand
      - uses: actions/upload-artifact@v7
        with:
          name: cloudstream-windows-x64
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error
